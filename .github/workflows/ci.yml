name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: inventory_db_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/inventory_db_test
      JWT_SECRET: ci_jwt_secret_supersecure
      JWT_REFRESH_SECRET: ci_jwt_refresh_secret_supersecure
      PORT: 3001
      NODE_ENV: test
      SENDGRID_API_KEY: SG.ci_test_key_not_used
      SENDGRID_FROM_EMAIL: no-reply@test.com
      CLOUDINARY_CLOUD_NAME: test
      CLOUDINARY_API_KEY: test
      CLOUDINARY_API_SECRET: test
      FRONTEND_URL: http://localhost:5173

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Create .env.test
        run: |
          cat > .env.test << EOF
          DATABASE_URL=$DATABASE_URL
          JWT_SECRET=$JWT_SECRET
          JWT_REFRESH_SECRET=$JWT_REFRESH_SECRET
          PORT=$PORT
          NODE_ENV=$NODE_ENV
          SENDGRID_API_KEY=$SENDGRID_API_KEY
          SENDGRID_FROM_EMAIL=$SENDGRID_FROM_EMAIL
          CLOUDINARY_CLOUD_NAME=$CLOUDINARY_CLOUD_NAME
          CLOUDINARY_API_KEY=$CLOUDINARY_API_KEY
          CLOUDINARY_API_SECRET=$CLOUDINARY_API_SECRET
          FRONTEND_URL=$FRONTEND_URL
          EOF

      - name: Run tests
        run: npm test
